version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dynamik_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dynamik_erp
      POSTGRES_USER: dynamik
      POSTGRES_PASSWORD: dynamik_dev_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dynamik -d dynamik_erp']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
